openapi: 3.1.0
info:
    title: FieldNamesService API
    version: 1.0.0
paths:
    /api/workers/{worker_id}/register:
        post:
            tags:
                - FieldNamesService
            summary: Register
            description: Registers a worker. The request body holds the multi-word fields.
            operationId: Register
            parameters:
                - name: worker_id
                  in: path
                  required: true
                  schema:
                    type: string
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/RegisterRequest'
                required: true
            responses:
                "200":
                    description: Successful response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/RegisterResponse'
                "400":
                    description: Validation error
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ValidationError'
                default:
                    description: Error response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
    /api/regions/{region_id}/workers:
        get:
            tags:
                - FieldNamesService
            summary: List
            description: |-
                Lists workers. The path and query parameter names are written in the proto
                 and must not change with the option.
            operationId: List
            parameters:
                - name: region_id
                  in: path
                  required: true
                  schema:
                    type: string
                - name: page_size
                  in: query
                  required: false
                  schema:
                    type: integer
                    format: int32
                - name: page_token
                  in: query
                  required: false
                  schema:
                    type: string
            responses:
                "200":
                    description: Successful response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ListResponse'
                "400":
                    description: Validation error
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ValidationError'
                default:
                    description: Error response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
    /api/profiles:
        post:
            tags:
                - FieldNamesService
            summary: SaveProfile
            description: Flattened fields, with and without a prefix.
            operationId: SaveProfile
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/FlattenedProfile'
                required: true
            responses:
                "200":
                    description: Successful response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/FlattenedProfile'
                "400":
                    description: Validation error
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ValidationError'
                default:
                    description: Error response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
    /api/events/flattened:
        post:
            tags:
                - FieldNamesService
            summary: PublishFlattened
            description: A flattened discriminated union.
            operationId: PublishFlattened
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/FlattenedEvent'
                required: true
            responses:
                "200":
                    description: Successful response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/FlattenedEvent'
                "400":
                    description: Validation error
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ValidationError'
                default:
                    description: Error response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
    /api/events/nested:
        post:
            tags:
                - FieldNamesService
            summary: PublishNested
            description: A nested discriminated union.
            operationId: PublishNested
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/NestedEvent'
                required: true
            responses:
                "200":
                    description: Successful response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/NestedEvent'
                "400":
                    description: Validation error
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ValidationError'
                default:
                    description: Error response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
components:
    schemas:
        Error:
            type: object
            properties:
                message:
                    type: string
                    description: Error message (e.g., 'user not found', 'database connection failed')
            description: Error is returned when a handler encounters an error. It contains a simple error message that the developer can customize.
        FieldViolation:
            type: object
            properties:
                field:
                    type: string
                    description: The field path that failed validation (e.g., 'user.email' for nested fields). For header validation, this will be the header name (e.g., 'X-API-Key')
                description:
                    type: string
                    description: Human-readable description of the validation violation (e.g., 'must be a valid email address', 'required field missing')
            required:
                - field
                - description
            description: FieldViolation describes a single validation error for a specific field.
        ValidationError:
            type: object
            properties:
                violations:
                    type: array
                    items:
                        $ref: '#/components/schemas/FieldViolation'
                    description: List of validation violations
            required:
                - violations
            description: ValidationError is returned when request validation fails. It contains a list of field violations describing what went wrong.
        RegisterRequest:
            type: object
            properties:
                workerId:
                    type: string
                workerName:
                    type: string
                protocolVersion:
                    type: integer
                    format: int32
                isDraining:
                    type: boolean
                workerKind:
                    type: string
                    enum:
                        - WORKER_KIND_UNSPECIFIED
                        - WORKER_KIND_ML
                nestedProbe:
                    $ref: '#/components/schemas/Probe'
                recentProbes:
                    type: array
                    items:
                        $ref: '#/components/schemas/Probe'
                extraLabels:
                    type: object
                    additionalProperties:
                        type: string
                capabilitySet:
                    type: array
                    items:
                        type: string
                legacy-token:
                    type: string
                    description: |-
                        The json_name option overrides the lowerCamelCase form; the proto name is
                         still the one written in proto mode.
            required:
                - workerName
                - protocolVersion
        ExtraLabelsEntry:
            type: object
            properties:
                key:
                    type: string
                value:
                    type: string
        Probe:
            type: object
            properties:
                probeDetail:
                    type: string
                retryCount:
                    type: integer
                    format: int32
        RegisterResponse:
            type: object
            properties:
                nextCursor:
                    type: string
                knownProbes:
                    type: array
                    items:
                        $ref: '#/components/schemas/Probe'
                lastProbe:
                    $ref: '#/components/schemas/Probe'
        ListRequest:
            type: object
            properties:
                regionId:
                    type: string
                pageSize:
                    type: integer
                    format: int32
                pageToken:
                    type: string
        ListResponse:
            type: object
            properties:
                knownProbes:
                    type: array
                    items:
                        $ref: '#/components/schemas/Probe'
                nextPageToken:
                    type: string
        FlattenedProfile:
            allOf:
                - type: object
                  properties:
                    profileId:
                        type: string
                    displayName:
                        type: string
                  required:
                    - displayName
                - type: object
                  properties:
                    streetLine:
                        type: string
                    postalCode:
                        type: string
                  description: Flattened from home_address
                - type: object
                  properties:
                    mail_streetLine:
                        type: string
                    mail_postalCode:
                        type: string
                  description: Flattened from mailing_address with prefix "mail_"
        StreetAddress:
            type: object
            properties:
                streetLine:
                    type: string
                postalCode:
                    type: string
        FlattenedEvent_text_content:
            type: object
            properties:
                eventId:
                    type: string
                sourceName:
                    type: string
                event_type:
                    type: string
                    enum:
                        - text_content
                bodyText:
                    type: string
            required:
                - event_type
        FlattenedEvent_img:
            type: object
            properties:
                eventId:
                    type: string
                sourceName:
                    type: string
                event_type:
                    type: string
                    enum:
                        - img
                imageUrl:
                    type: string
                pixelWidth:
                    type: integer
                    format: int32
            required:
                - event_type
        FlattenedEvent:
            oneOf:
                - $ref: '#/components/schemas/FlattenedEvent_text_content'
                - $ref: '#/components/schemas/FlattenedEvent_img'
            discriminator:
                propertyName: event_type
                mapping:
                    text_content: '#/components/schemas/FlattenedEvent_text_content'
                    img: '#/components/schemas/FlattenedEvent_img'
        TextContent:
            type: object
            properties:
                bodyText:
                    type: string
        ImageContent:
            type: object
            properties:
                imageUrl:
                    type: string
                pixelWidth:
                    type: integer
                    format: int32
        NestedEvent:
            type: object
            oneOf:
                - type: object
                  properties:
                    textContent:
                        $ref: '#/components/schemas/TextContent'
                - type: object
                  properties:
                    imageContent:
                        $ref: '#/components/schemas/ImageContent'
                - type: object
                  properties:
                    plainValue:
                        type: string
            discriminator:
                propertyName: payload_kind
                mapping:
                    text_content: '#/components/schemas/TextContent'
                    img: '#/components/schemas/ImageContent'
            properties:
                eventId:
                    type: string
                sourceName:
                    type: string
                payload_kind:
                    type: string
                    enum:
                        - text_content
                        - img
                        - plain
            required:
                - sourceName
